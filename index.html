<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/image-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang quản trị - Kho Truyện Tự Kể</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #e6fdfb 0%, #ffffff 100%);
          z-index: 9999;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          max-width: 320px;
          padding: 20px;
        }
        .loader-logo {
          width: 140px;
          height: auto;
          margin-bottom: 24px;
          mix-blend-mode: multiply;
          animation: logo-pulse 2s infinite ease-in-out;
        }
        .loader-title {
          font-family: "Georgia", serif;
          font-size: 24px;
          font-weight: bold;
          color: #272727;
          margin: 0 0 8px 0;
          letter-spacing: 0.5px;
        }
        .loader-subtitle {
          font-size: 14px;
          color: rgba(39, 39, 39, 0.7);
          margin: 0 0 24px 0;
          font-weight: 500;
        }
        .progress-bar-container {
          width: 180px;
          height: 4px;
          background: rgba(29, 191, 175, 0.15);
          border-radius: 4px;
          overflow: hidden;
          position: relative;
        }
        .progress-bar-indicator {
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          width: 40%;
          background: #1dbfaf;
          border-radius: 4px;
          animation: progress-slide 1.5s infinite ease-in-out;
        }
        @keyframes logo-pulse {
          0%, 100% {
            transform: scale(1);
            opacity: 0.95;
          }
          50% {
            transform: scale(1.05);
            opacity: 1;
            box-shadow: 0 15px 30px rgba(29, 191, 175, 0.25);
          }
        }
        @keyframes progress-slide {
          0% {
            left: -40%;
          }
          50% {
            left: 100%;
            width: 30%;
          }
          100% {
            left: 100%;
            width: 0%;
          }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-content">
          <img src="/image-logo.png" alt="Logo" class="loader-logo" />
          <h1 class="loader-title">Trang Quản Trị</h1>
          <p class="loader-subtitle">Đang kết nối hệ thống...</p>
          <div class="progress-bar-container">
            <div class="progress-bar-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
